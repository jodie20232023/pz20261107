<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>普真精舍・線上禪遊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2b2118;--paper:#f6efe2;--gold:#c99a3b;--glass:rgba(28,22,16,.55)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#1b1712;font-family:"Noto Sans TC",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
  canvas{display:block;touch-action:none}
  .glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12)}
  #loc{position:fixed;top:14px;left:14px;padding:8px 14px;border-radius:999px;font-size:14px;display:flex;gap:8px;align-items:center}
  #loc b{font-family:"Noto Serif TC",serif;font-weight:900;letter-spacing:.1em}
  #loc span{opacity:.8}
  #tr{position:fixed;top:14px;right:14px;display:flex;gap:8px;align-items:center}
  #counts{padding:8px 14px;border-radius:999px;font-size:13px;opacity:.95}
  .ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:16px;color:#fff}
  #hint{position:fixed;top:64px;left:50%;transform:translateX(-50%);font-size:13px;padding:6px 14px;border-radius:999px;transition:opacity 1s;white-space:nowrap}
  #actions{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:22px}
  #actions button{all:unset;cursor:pointer;width:64px;padding:6px 0 5px;border-radius:16px;text-align:center;font-size:12px;color:#f3eadb;transition:background .2s}
  #actions button i{display:block;font-style:normal;font-size:22px;line-height:28px}
  #actions button:hover{background:rgba(255,255,255,.1)}
  #actions button.on{background:rgba(201,154,59,.45);color:#fff}
  #toast{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);font-family:"Noto Serif TC",serif;font-size:20px;padding:12px 22px;border-radius:14px;opacity:0;transition:opacity .5s;pointer-events:none;text-align:center;line-height:1.6}
  #medi{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  #ring{width:90px;height:90px;border-radius:50%;border:2px solid rgba(255,236,190,.8);box-shadow:0 0 30px rgba(255,220,150,.35) inset,0 0 20px rgba(255,220,150,.25);display:grid;place-items:center;font-family:"Noto Serif TC",serif;font-size:16px;transform:scale(.7)}
  #mtime{font-size:13px;opacity:.85;padding:4px 12px;border-radius:999px}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at center,#3a2c1c 0%,#16120d 70%);z-index:10;transition:opacity .8s}
  #start .logo{font-family:"Noto Serif TC",serif;font-weight:900;font-size:56px;letter-spacing:.25em;color:#f2c96b;text-shadow:0 2px 20px rgba(242,201,107,.3);padding-left:.25em}
  #start .sub{font-size:15px;letter-spacing:.4em;opacity:.75;padding-left:.4em}
  #start button{margin-top:22px;all:unset;cursor:pointer;padding:12px 34px;border-radius:999px;background:#c99a3b;color:#1b1309;font-weight:700;font-size:16px;letter-spacing:.2em;box-shadow:0 6px 24px rgba(201,154,59,.35)}
  #start button[disabled]{opacity:.5;cursor:default}
  #start .tip{font-size:12px;opacity:.5;margin-top:6px}
  @media (max-width:520px){#actions button{width:54px}#start .logo{font-size:40px}#counts{font-size:11px;padding:6px 10px}#loc{font-size:12px}}
</style>
</head>
<body>
<div id="start">
  <div class="logo">普真精舍</div>
  <div class="sub">線上禪遊</div>
  <button id="enter" disabled>準備中…</button>
  <div class="tip">建議開聲音・手機電腦都可以玩</div>
</div>
<div id="loc" class="glass"><b>普真精舍</b><span id="locname">街道</span></div>
<div id="tr">
  <div id="counts" class="glass">🙏 0 · 木魚 0 · 念珠 0</div>
  <div id="snd" class="ibtn glass" title="聲音">🔊</div>
</div>
<div id="hint" class="glass">點地板走路 · 拖曳轉視角 · 滾輪縮放 · 也可以用 WASD</div>
<div id="actions" class="glass">
  <button data-a="gassho"><i>🙏</i>合掌</button>
  <button data-a="bow"><i>🙇</i>禮佛</button>
  <button data-a="muyu"><i>🪘</i>木魚</button>
  <button data-a="beads"><i>📿</i>念珠</button>
  <button data-a="sit"><i>🧘</i>打坐</button>
</div>
<div id="medi"><div id="ring">吸</div><div id="mtime" class="glass">00:00</div></div>
<div id="toast" class="glass"></div>
<div id="fade"></div>

<script type="module">
import * as THREE from 'three';

/* ---------------- basics ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe0ea);
scene.fog = new THREE.Fog(0xcfe0ea, 30, 70);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xfff6e8, 0x6b5a48, 1.25));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.5);
sun.position.set(8, 18, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-20,right:20,top:20,bottom:-24,near:1,far:60});
sun.shadow.bias = -0.0005;
scene.add(sun);
// 7F sun copy so shadows work upstairs
const sun7 = sun.clone(); sun7.position.set(68,18,16); sun7.target.position.set(60,0,-4);
scene.add(sun7, sun7.target);

const colliders = [];   // {x1,x2,z1,z2}
const occluders = [];   // meshes blocking camera
const clickables = [];  // meshes with userData.click
const floors = [];      // walkable floor meshes

/* ---------------- canvas textures ---------------- */
const SERIF = '"Noto Serif TC", "PMingLiU", serif';
function canvasTex(w, h, draw, repeat){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if(repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function noise(g,w,h,n,alpha,col){ for(let i=0;i<n;i++){ g.fillStyle = col(Math.random()); g.globalAlpha = alpha*Math.random(); const s=Math.random()*3+1; g.fillRect(Math.random()*w, Math.random()*h, s, s);} g.globalAlpha=1; }
function vtext(g, str, x, y, size, gap, color){ g.fillStyle=color; g.font=`900 ${size}px ${SERIF}`; g.textAlign='center'; g.textBaseline='middle'; [...str].forEach((ch,i)=>g.fillText(ch, x, y+i*(size+gap))); }

let T = {}; // textures, created after fonts load
function makeTextures(){
  T.wood = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#b77a45'; g.fillRect(0,0,w,h);
    for(let i=0;i<8;i++){ const y=i*h/8; g.fillStyle = i%2?'#b27443':'#bd8250'; g.fillRect(0,y,w,h/8-2); g.fillStyle='#7d4f2a'; g.fillRect(0,y+h/8-2,w,2);
      for(let k=0;k<40;k++){ g.strokeStyle='rgba(110,64,30,.18)'; g.beginPath(); const yy=y+Math.random()*h/8; g.moveTo(0,yy); g.bezierCurveTo(w*.3,yy+Math.random()*6-3,w*.6,yy+Math.random()*6-3,w,yy); g.stroke(); }
      g.fillStyle='rgba(80,45,20,.5)'; g.fillRect(((i*173)%w), y, 2, h/8); }
  },[3,3]);
  T.darkwood = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#6b3f22'; g.fillRect(0,0,w,h); for(let k=0;k<80;k++){ g.strokeStyle='rgba(40,20,8,.2)'; g.beginPath(); const x=Math.random()*w; g.moveTo(x,0); g.lineTo(x+Math.random()*10-5,h); g.stroke(); } },[1,1]);
  T.panel = canvasTex(512,256,(g,w,h)=>{ g.fillStyle='#a8682f'; g.fillRect(0,0,w,h);
    for(let i=0;i<4;i++){ const x=i*w/4+8; g.fillStyle='#b8783b'; g.fillRect(x,10,w/4-16,h-20); g.strokeStyle='#7a4518'; g.lineWidth=3; g.strokeRect(x,10,w/4-16,h-20);
      g.strokeStyle='rgba(120,70,30,.6)'; g.lineWidth=2; g.beginPath(); g.moveTo(x,10); g.lineTo(x+w/4-16,h-10); g.moveTo(x+w/4-16,10); g.lineTo(x,h-10); g.stroke(); }
  },[2,1]);
  T.terrazzo = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#c9c9c4'; g.fillRect(0,0,w,h); noise(g,w,h,5000,.6,r=>r<.5?'#9d9d98':(r<.8?'#e8e8e4':'#7c7c78')); g.strokeStyle='rgba(120,120,115,.5)'; g.lineWidth=2; g.strokeRect(0,0,w,h); },[6,6]);
  T.asphalt = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#5d5f63'; g.fillRect(0,0,w,h); noise(g,w,h,3000,.5,r=>r<.5?'#46484c':'#77797d'); },[10,4]);
  T.sidewalk = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#b9b2a6'; g.fillRect(0,0,w,h); noise(g,w,h,1200,.35,r=>r<.5?'#a19a8e':'#cdc6ba'); g.strokeStyle='#8f887d'; g.lineWidth=3; g.strokeRect(0,0,w,h); },[14,3]);
  T.granite = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#b6aea5'; g.fillRect(0,0,w,h); noise(g,w,h,4000,.6,r=>r<.4?'#8d847c':(r<.8?'#d3cbc2':'#5f5853')); },[1,2]);
  T.facade = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#b7b0a7'; g.fillRect(0,0,w,h); g.strokeStyle='#9c958c'; g.lineWidth=2; for(let y=0;y<h;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();} for(let x=0;x<w;x+=64){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();} },[6,4]);
  T.sign = canvasTex(2048,360,(g,w,h)=>{
    const grd=g.createLinearGradient(0,0,0,h); grd.addColorStop(0,'#ffb02e'); grd.addColorStop(1,'#f39a12'); g.fillStyle=grd; g.fillRect(0,0,w,h);
    g.fillStyle='#c8102e'; g.fillRect(40,40,300,280);
    // stupa-ish logo
    g.fillStyle='#fff'; g.beginPath(); g.moveTo(190,80); g.lineTo(200,120); g.lineTo(180,120); g.fill();
    g.beginPath(); g.ellipse(190,165,60,45,0,Math.PI,0); g.fill();
    for(let i=-2;i<=2;i++){ g.beginPath(); g.ellipse(190+i*28,205,16,30,i*.25,0,Math.PI*2); g.fill(); }
    g.font=`900 44px ${SERIF}`; g.textAlign='center'; g.fillText('中台禪寺',190,290);
    const chars='普真精舍'; g.textBaseline='middle';
    chars.split('').forEach((ch,i)=>{ const cx=520+i*300; g.fillStyle='#f1ebd6'; g.beginPath(); g.arc(cx,180,128,0,Math.PI*2); g.fill(); g.fillStyle='#2a2420'; g.font=`900 170px ${SERIF}`; g.fillText(ch,cx,186); });
    g.fillStyle='#4a1a00'; g.font=`700 52px ${SERIF}`; g.textAlign='left';
    g.fillText('歡迎入內禮佛',1680,70); g.fillText('聽經聞法',1730,140); g.fillText('拜懺共修',1730,205);
    g.fillStyle='#c8102e'; g.fillRect(1670,245,350,70); g.fillStyle='#fff'; g.font=`700 44px ${SERIF}`; g.fillText('禪修靜坐',1760,282);
  });
  T.banner = canvasTex(1600,140,(g,w,h)=>{ g.fillStyle='#d4232f'; g.fillRect(0,0,w,h); g.fillStyle='#ffe089'; g.font=`900 96px ${SERIF}`; g.textAlign='center'; g.textBaseline='middle'; g.fillText('普 真 精 舍 禪 修 班 招 生 中',w/2,h/2+4); });
  const couplet=(s)=>canvasTex(128,1024,(g,w,h)=>{ g.drawImage(T.granite.image,0,0,w,h); vtext(g,s,w/2,80,92,15,'#4b3a2a'); });
  T.coupL = couplet('無量眾生同歸佛性'); T.coupR = couplet('大千世界不二法門');
  T.plaque = canvasTex(1024,220,(g,w,h)=>{ g.drawImage(T.darkwood.image,0,0,w,h); g.fillStyle='rgba(60,30,10,.35)'; g.fillRect(0,0,w,h); g.strokeStyle='#3a1e0c'; g.lineWidth=14; g.strokeRect(7,7,w-14,h-14); g.fillStyle='#e9c97a'; g.font=`900 140px ${SERIF}`; g.textAlign='center'; g.textBaseline='middle'; ['殿','寶','雄','大'].forEach((c,i)=>g.fillText(c,170+i*228,h/2+6)); });
  T.zhaogu = canvasTex(800,220,(g,w,h)=>{ g.drawImage(T.darkwood.image,0,0,w,h); g.fillStyle='#1b1f3a'; g.font=`900 130px ${SERIF}`; g.textAlign='center'; g.textBaseline='middle'; ['頭','話','顧','照'].forEach((c,i)=>g.fillText(c,130+i*180,h/2+8)); });
  T.photos = canvasTex(512,320,(g,w,h)=>{ g.fillStyle='#f4efe4'; g.fillRect(0,0,w,h); g.fillStyle='#c33'; g.fillRect(10,8,w-20,16); for(let y=32;y<h-8;y+=30) for(let x=10;x<w-30;x+=38){ const v=60+Math.random()*120; g.fillStyle=`rgb(${v+30},${v+10},${v})`; g.fillRect(x,y,34,26); g.fillStyle=`rgba(${Math.random()*200},${Math.random()*120},60,.5)`; g.fillRect(x+4,y+6,12,16);} });
  T.valance = canvasTex(1024,200,(g,w,h)=>{ g.clearRect(0,0,w,h); g.fillStyle='#d9b36a'; g.fillRect(0,0,w,22);
    g.fillStyle='#2d7a4b'; g.beginPath(); g.moveTo(0,22); for(let i=0;i<=8;i++){ const x=i*w/8; g.lineTo(x,22); } g.lineTo(w,150); for(let i=8;i>=0;i--){ const x=i*w/8; g.quadraticCurveTo(x+w/16,190,x,150);} g.closePath(); g.fill();
    for(let i=0;i<4;i++){ const cx=w/8+i*w/4; g.fillStyle='#e8c46a'; g.beginPath(); g.arc(cx,85,34,0,Math.PI*2); g.fill(); g.fillStyle='#b8452d'; g.beginPath(); g.arc(cx,85,20,0,Math.PI*2); g.fill(); }
    g.strokeStyle='#e8c46a'; g.lineWidth=6; g.beginPath(); for(let i=0;i<8;i++){ const x=i*w/8; g.moveTo(x,150); g.quadraticCurveTo(x+w/16,190,x+w/8,150);} g.stroke(); });
  T.enso = canvasTex(256,320,(g,w,h)=>{ g.fillStyle='#3a2a1c'; g.fillRect(0,0,w,h); g.fillStyle='#f3ecdc'; g.fillRect(14,14,w-28,h-28); g.strokeStyle='#1a1a1a'; g.lineCap='round'; for(let k=0;k<6;k++){ g.lineWidth=14-k*2; g.globalAlpha=.25+k*.12; g.beginPath(); g.arc(w/2,h/2,70+k*.6,-1.2+k*.02,4.7); g.stroke(); } g.globalAlpha=1; g.fillStyle='#b22'; g.fillRect(w-60,h-70,18,18); });
  T.ink = canvasTex(256,320,(g,w,h)=>{ g.fillStyle='#3a2a1c'; g.fillRect(0,0,w,h); g.fillStyle='#efe6d2'; g.fillRect(14,14,w-28,h-28); g.strokeStyle='#2d3b2a'; g.lineWidth=3; for(let i=0;i<7;i++){ g.beginPath(); g.moveTo(60+i*15,h-40); g.quadraticCurveTo(80+i*10,140,120+i*12,60+i*8); g.stroke(); } g.fillStyle='#c0506a'; for(let i=0;i<9;i++){ g.beginPath(); g.arc(90+Math.random()*90,80+Math.random()*120,7,0,Math.PI*2); g.fill(); } });
  T.scroll = canvasTex(128,640,(g,w,h)=>{ g.fillStyle='#f4ede0'; g.fillRect(0,0,w,h); g.fillStyle='#b8402f'; g.fillRect(0,0,w,20); g.fillRect(0,h-20,w,20); vtext(g,'止觀雙運定慧等持',w/2,70,58,8,'#2a2a2a'); });
}

/* ---------------- builders ---------------- */
const M = (opts)=>new THREE.MeshStandardMaterial(Object.assign({roughness:.8, metalness:0}, opts));
function box(w,h,d,mat,x,y,z,parent=scene){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); parent.add(m); return m; }
function plane(w,h,mat,x,y,z,ry=0,parent=scene){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat); m.position.set(x,y,z); m.rotation.y=ry; parent.add(m); return m; }
function wall(x1,z1,x2,z2,h,mat,{y0=0,thick=.3,occ=true,col=true}={}){
  const w=Math.abs(x2-x1)||thick, d=Math.abs(z2-z1)||thick;
  const m=box(w,h,d,mat,(x1+x2)/2,y0+h/2,(z1+z2)/2); m.receiveShadow=true;
  if(occ) occluders.push(m);
  if(col && y0<1.5) colliders.push({x1:Math.min(x1,x2)-(x1===x2?thick/2:0),x2:Math.max(x1,x2)+(x1===x2?thick/2:0),z1:Math.min(z1,z2)-(z1===z2?thick/2:0),z2:Math.max(z1,z2)+(z1===z2?thick/2:0)});
  return m;
}
function floor(x1,z1,x2,z2,mat,y=0){ const m=new THREE.Mesh(new THREE.PlaneGeometry(x2-x1,z2-z1),mat); m.rotation.x=-Math.PI/2; m.position.set((x1+x2)/2,y,(z1+z2)/2); m.receiveShadow=true; scene.add(m); floors.push(m); return m; }
function ceiling(x1,z1,x2,z2,y,mat){ const m=new THREE.Mesh(new THREE.PlaneGeometry(x2-x1,z2-z1),mat); m.rotation.x=Math.PI/2; m.position.set((x1+x2)/2,y,(z1+z2)/2); scene.add(m); return m; }
function addCol(x,z,w,d){ colliders.push({x1:x-w/2,x2:x+w/2,z1:z-d/2,z2:z+d/2}); }
function clickable(obj, fn, label){ obj.traverse(o=>{ if(o.isMesh){ o.userData.click=fn; o.userData.label=label; clickables.push(o);} }); }
function shadowAll(obj){ obj.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } }); return obj; }

const goldM = M({color:0xd8a836, metalness:.55, roughness:.32, emissive:0x3a2600, emissiveIntensity:.35});
function buddha(scale=1, hue='gold'){
  const g=new THREE.Group(); const gm = hue==='gold'?goldM:M({color:0xe7ead8,roughness:.35,emissive:0x202418,emissiveIntensity:.25});
  const pink=M({color:0xe7a3a8,roughness:.5});
  // lotus base
  const lb=new THREE.Mesh(new THREE.CylinderGeometry(.55,.45,.18,24),M({color:0x8c5a2b})); lb.position.y=.09; g.add(lb);
  for(let i=0;i<14;i++){ const p=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),pink); p.scale.set(.8,1.2,.45); const a=i/14*Math.PI*2; p.position.set(Math.cos(a)*.48,.3,Math.sin(a)*.48); p.rotation.y=-a; p.rotation.z=.3; g.add(p);}
  const legs=new THREE.Mesh(new THREE.SphereGeometry(.5,24,16),gm); legs.scale.set(1,.38,.7); legs.position.y=.45; g.add(legs);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.27,.42,.75,20),gm); body.position.y=.88; g.add(body);
  const hands=new THREE.Mesh(new THREE.SphereGeometry(.16,12,10),gm); hands.scale.set(1.3,.5,.9); hands.position.set(0,.6,.3); g.add(hands);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.24,24,18),gm); head.position.y=1.42; g.add(head);
  const ush=new THREE.Mesh(new THREE.SphereGeometry(.13,16,12),gm); ush.position.y=1.63; g.add(ush);
  for(const s of [-1,1]){ const ear=new THREE.Mesh(new THREE.CapsuleGeometry(.04,.18,4,8),gm); ear.position.set(s*.23,1.36,0); g.add(ear); }
  const halo=new THREE.Mesh(new THREE.TorusGeometry(.42,.035,8,40),goldM); halo.position.set(0,1.42,-.18); g.add(halo);
  const halo2=new THREE.Mesh(new THREE.CircleGeometry(.4,40),M({color:0xf6d580,emissive:0x7a5a10,emissiveIntensity:.6,transparent:true,opacity:.55})); halo2.position.set(0,1.42,-.2); g.add(halo2);
  g.scale.setScalar(scale); return shadowAll(g);

    const v=fwd.multiplyScalar(-kz).add(rt.multiplyScalar(kx)).normalize(); P.pos.addScaledVector(v,speed*dt); P.targetYaw=Math.atan2(v.x,v.z); moving=true; }
  else if(path.length){ const tgt=path[0]; const d=new THREE.Vector3(tgt.x-P.pos.x,0,tgt.z-P.pos.z); const L=d.length();
    if(L<.08){ path.shift(); if(!path.length){ marker.visible=false; if(arriveCb){ const cb=arriveCb; arriveCb=null; cb(); } } }
    else { d.normalize(); P.pos.addScaledVector(d,Math.min(L,speed*dt)); P.targetYaw=Math.atan2(d.x,d.z); moving=true; } }
  if(moving){ const before=P.pos.clone(); collide(P.pos); if(path.length && before.distanceTo(P.pos)>0 && P.pos.distanceTo(path[0])>0.5){ P.stuck=(P.stuck||0)+dt; if(P.stuck>1.2){ path=[]; marker.visible=false; P.stuck=0; } } else P.stuck=0; }
  // yaw smoothing
  if(P.targetYaw!==undefined){ let dy=P.targetYaw-P.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); P.yaw+=dy*Math.min(1,dt*10); }
  P.root.position.set(P.pos.x, P.y, P.pos.z); P.root.rotation.y=P.yaw;
  // pose
  modeT+=dt; let target=STAND;
  if(moving){ walkPhase+=dt*9; const s=Math.sin(walkPhase); target={...STAND,lx:s*.6,rx:-s*.6,alx:-s*.5,arx:s*.5,hipsY:.55+Math.abs(Math.cos(walkPhase))*.03}; }
  else if(mode==='gassho') target=GASSHO;
  else if(mode==='bow'){ const bt=modeT-bowN*BOW_LEN; target=bowPose(bt); if(bt>BOW_LEN){ bowN++; stats.bows++; saveStats(); if(bowN>=3){ mode='gassho'; setBtn(); toast('禮佛三拜 圓滿 🙏'); } else bell(); } }
  else if(mode==='muyu'){ const ph=(modeT*1.6)%1; const wave=ph<.25?Math.sin(ph/.25*Math.PI/2):Math.cos((ph-.25)/.75*Math.PI/2); target={...STAND,alx:-.95,alz:-.3,arx:-.55-wave*.0-(.55*(1-wave)),arz:.35,hx:.25};
    const cyc=Math.floor(modeT*1.6); if(cyc>lastKnockPhase){ lastKnockPhase=cyc; } if(ph<.25 && P.knocked!==cyc){ } if(ph>=.24 && P.knocked!==cyc){ P.knocked=cyc; knock(); stats.knocks++; saveStats(); } }
  else if(mode==='beads'){ target=BEADS; P.beads.rotation.z+=dt*1.2; if(modeT-lastBead>.9){ lastBead=modeT; bead(); stats.beads++; saveStats(); if(stats.beads%108===0){ bell(); toast('念珠 一百零八 圓滿一串 📿'); } } }
  else if(mode==='sit'){ target=SIT; const el=(performance.now()-mediStart)/1000; const br=(el%10); const sc=br<4? .7+.45*ss(br/4) : 1.15-.45*ss((br-4)/6);
    $('#ring').style.transform=`scale(${sc})`; $('#ring').textContent=br<4?'吸':'呼'; $('#mtime').textContent=`${String(Math.floor(el/60)).padStart(2,'0')}:${String(Math.floor(el%60)).padStart(2,'0')}`;
    if(Math.floor(el)>0 && Math.floor(el)%300===0 && P.lastBell!==Math.floor(el)){ P.lastBell=Math.floor(el); bell(.5); } }
  else { target={...STAND, tx:Math.sin(t*1.5)*.01, hipsY:.55+Math.sin(t*2)*.006}; }
  const sitting = mode==='sit' && P.pose.hipsY<.3; P.lap.visible=sitting; P.legs.forEach(l=>l.visible=!sitting);
  const shut = sitting || (mode==='bow' && (modeT%BOW_LEN)>1.2 && (modeT%BOW_LEN)<3.0);
  P.eyesOpen.forEach(e=>e.visible=!shut); P.eyesShut.forEach(e=>e.visible=shut);
  const k=1-Math.exp(-dt*(mode==='bow'?20:10)); for(const key in P.pose) P.pose[key]+= (target[key]-P.pose[key])*k; applyPose(P.pose);
  // zone
  const z=zoneOf(P.pos.x,P.pos.z); if(z!==curZone){ curZone=z; $('#locname').textContent=ZNAME[z]; setAmb(z); if(z==='hall') hintMsg('來到大雄寶殿 · 點拜墊走過去，再按「禮佛」'); }
  // marker
  if(marker.visible){ markerT+=dt; marker.scale.setScalar(1+.15*Math.sin(markerT*6)); }
  // camera
  const tgtY = P.y + (mode==='sit'?0.9:1.25);
  camTarget.lerp(new THREE.Vector3(P.pos.x,tgtY,P.pos.z), snapCam?1:Math.min(1,dt*8));
  const dir=new THREE.Vector3(Math.sin(camYaw)*Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw)*Math.cos(camPitch));
  let dist=camDist; ray.set(camTarget,dir); ray.far=camDist; const hits=ray.intersectObjects(occluders,false); if(hits.length) dist=Math.max(.6,hits[0].distance-.25);
  const ceilY = z==='7F'?3.6:(z==='hall'?4.2:(z==='lobby'?4.6:99));
  const want=camTarget.clone().addScaledVector(dir,dist); if(want.y>ceilY){ const s=(ceilY-camTarget.y)/(want.y-camTarget.y); want.lerpVectors(camTarget,want,Math.max(.2,s)); }
  if(snapCam){ camera.position.copy(want); snapCam=false; } else camera.position.lerp(want,Math.min(1,dt*10));
  camera.lookAt(camTarget);
}
function loop(){ const dt=Math.min(.05,clock.getDelta()); update(dt); renderer.render(scene,camera); requestAnimationFrame(loop); }
